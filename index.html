<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Blog preview card</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <article class="card">
      <img class="card__image" src="./assets/images/illustration-article.svg" width="336" height="200" alt="">
      <div class="card__body">
        <p class="card__tag">Learning</p>
        <p class="card__date">Published <time datetime="2023-12-21">21 Dec 2023</time></p>
        <h1 class="card__title">
          <a class="card__link" href="/blog/html-css-foundations">HTML &amp; CSS foundations</a>
        </h1>
        <p class="card__summary">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
      </div>
      <footer class="card__author">
        <img src="./assets/images/image-avatar.webp" alt="" width="32" height="32">
        <p><span class="visually-hidden">Written by</span> Greg Hooper</p>
      </footer>
    </article>
  </main>
  <footer class="attribution">
    Challenge by <a class="attribution__link" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a class="attribution__link" href="https://www.frontendmentor.io/profile/alexisborron">Alexis</a>.
  </footer>
</body>

</html>
